<!DOCTYPE html>
<html lang="en">
<head>
    <script>if(window.location.protocol==='file:'){var _p=window.location.pathname.split('/').pop()||'index.html';window.location.replace('https://kaitlynsewell.github.io/ad-website-demo/'+_p);}</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AD.Website.Demo - Farms & Facilities</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="favicon-180.png" />
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark-mode');</script>
    <link rel="stylesheet" href="styles.css?v=20261104f" />
    <script src="translations.js?v=20261106f"></script>
    <style>
        .farms-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            height: 100%;
            padding: 0 20px 20px 0;
            box-sizing: border-box;
        }

        .farms-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .farms-toolbar select {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            background: white;
            color: #2c3e50;
            min-width: 200px;
        }

        .farms-toolbar input[type="text"] {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            min-width: 220px;
        }

        .farms-count {
            font-size: 13px;
            color: #666;
            margin-left: auto;
        }

        .farms-table-wrapper {
            overflow: auto;
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .farms-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .farms-table th {
            background: #4169e1;
            color: white;
            padding: 9px 12px;
            text-align: left;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            position: sticky;
            top: 0;
        }

        .farms-table th:hover {
            background: #2a52cc;
        }

        .farms-table th.sorted-asc::after  { content: ' ▲'; font-size: 10px; }
        .farms-table th.sorted-desc::after { content: ' ▼'; font-size: 10px; }

        .farms-table td {
            padding: 7px 12px;
            border-bottom: 1px solid #eee;
            color: #2c3e50;
        }

        .farms-table tr:hover td {
            background: #f0f4ff;
        }

        .farms-loading {
            padding: 30px;
            text-align: center;
            color: #888;
            font-size: 14px;
        }

        .farms-error {
            padding: 20px;
            color: #c0392b;
            font-size: 14px;
            background: #fdf0ef;
            border-radius: 5px;
            border: 1px solid #e9b8b5;
        }


        html.dark-mode .farms-toolbar select,
        html.dark-mode .farms-toolbar input[type="text"] {
            background: #1a1a2e;
            border-color: #555;
            color: #e0e0e0;
        }

        html.dark-mode .farms-table-wrapper {
            border-color: #444;
        }

        html.dark-mode .farms-table td {
            color: #e0e0e0;
            border-bottom-color: #3a3a50;
        }

        html.dark-mode .farms-table tr:hover td {
            background: #2a2a40;
        }

        html.dark-mode .farms-count {
            color: #aaa;
        }

        /* Below the table: Show More button, or "Showing All Facilities" once every row is shown */
        .farms-more {
            display: none;
            padding: 14px;
            text-align: center;
            border-top: 1px solid #eee;
        }
        .farms-more-btn {
            padding: 8px 22px;
            font-size: 14px;
            color: white;
            background: #4169e1;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .farms-more-btn:hover { background: #2a52cc; }
        .farms-all-shown {
            font-size: 13px;
            color: #888;
            font-style: italic;
        }
        html.dark-mode .farms-more { border-top-color: #3a3a50; }
        html.dark-mode .farms-all-shown { color: #aaa; }

    </style>
</head>
<body>
    <h1 class="page-heading">
        <div class="logo">

            <a href="advanced-calculator-2.html" class="header-nav-btn header-home-btn" data-i18n="nav-home-tab">Home</a>

        </div>

    <div class="page-layout">
        <div class="main-content" style="flex-direction: column; align-items: flex-start; justify-content: flex-start; min-width: 0;">
            <h2 class="section-heading" data-i18n="farms-title">Farms &amp; Facilities</h2>
            <div class="farms-container">
                <div class="farms-toolbar">
                    <select id="category-select" onchange="onCategoryChange()">
                        <option value="beef">Beef Cattle (3,112)</option>
                        <option value="dairy">Dairy Cattle (438)</option>
                        <option value="swine">Swine (9,442)</option>
                        <option value="turkeys">Turkeys (158)</option>
                        <option value="chickens">Chickens (200)</option>
                        <option value="biodiesel">Biodiesel Plants (8)</option>
                        <option value="ethanol">Ethanol Plants (42)</option>
                        <option value="wastewater">Wastewater Treatment (1,029)</option>
                        <option value="powerplants">Power Plants (101)</option>
                        <option value="standbyplants">Standby Power Plants (40)</option>
                        <option value="windplants">Wind Power (122)</option>
                        <option value="solarplants">Solar Power (37)</option>
                        <option value="landfill">Landfill Sites (83)</option>
                        <option value="digesters">Anaerobic Digesters (87)</option>
                        <option value="foodwaste">Food Waste (275)</option>
                    </select>
                    <input type="text" id="search-input" placeholder="Search..." data-i18n-placeholder="farms-search" oninput="onSearch()" />
                    <span class="farms-count" id="record-count"></span>
                </div>
                <div class="farms-table-wrapper">
                    <div class="farms-loading" id="farms-loading" data-i18n="farms-loading">Loading data...</div>
                    <table class="farms-table" id="farms-table" style="display:none;">
                        <thead id="farms-thead"></thead>
                        <tbody id="farms-tbody"></tbody>
                    </table>
                    <div class="farms-more" id="farms-more"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var categories = {
            beef:        { file: 'geojson/beef.geojson',        cols: [{h:'Facility Name',p:'facName'},{h:'City',p:'CityName'},{h:'County',p:'countyName'},{h:'Head Count',p:'CattleBeef',num:true},{h:'Manure (tons/year)',p:'ManureTons',num:true},{h:'On-Site Digester',p:'OnSiteAD'},{h:'Source',p:'Source'},{h:'Last Updated',p:'SourceDate'}] },
            dairy:       { file: 'geojson/dairy.geojson',       cols: [{h:'Facility Name',p:'facName'},{h:'City',p:'CityName'},{h:'County',p:'countyName'},{h:'Head Count',p:'CattleDair',num:true},{h:'Manure (tons/year)',p:'ManureTons',num:true},{h:'On-Site Digester',p:'OnSiteAD'},{h:'Source',p:'Source'},{h:'Last Updated',p:'SourceDate'}] },
            swine:       { file: 'geojson/swine.geojson',       cols: [{h:'Facility Name',p:'facName'},{h:'City',p:'CityName'},{h:'County',p:'countyName'},{h:'Head Count',p:'Swine',num:true},{h:'Manure (tons/year)',p:'ManureTons',num:true},{h:'On-Site Digester',p:'OnSiteAD'},{h:'Source',p:'Source'},{h:'Last Updated',p:'SourceDate'}] },
            turkeys:     { file: 'geojson/turkeys.geojson',     cols: [{h:'Facility Name',p:'facName'},{h:'City',p:'CityName'},{h:'County',p:'countyName'},{h:'Head Count',p:'Turkeys',num:true},{h:'Manure (tons/year)',p:'ManureTons',num:true},{h:'On-Site Digester',p:'OnSiteAD'},{h:'Source',p:'Source'},{h:'Last Updated',p:'SourceDate'}] },
            chickens:    { file: 'geojson/chickens.geojson',    cols: [{h:'Facility Name',p:'facName'},{h:'City',p:'CityName'},{h:'County',p:'countyName'},{h:'Head Count',p:'Chickens',num:true},{h:'Manure (tons/year)',p:'ManureTons',num:true},{h:'On-Site Digester',p:'OnSiteAD'},{h:'Source',p:'Source'},{h:'Last Updated',p:'SourceDate'}] },
            biodiesel:   { file: 'geojson/biodiesel.geojson',   cols: [{h:'Plant Name',p:'Plant'},{h:'City',p:'City'},{h:'Feedstock',p:'Feedstock'},{h:'Capacity (million gallons of biodiesel per year)',p:'CapMGb',num:true},{h:'Source',p:'Source'},{h:'Last Updated',p:'SourceDate'}] },
            ethanol:     { file: 'geojson/ethanol.geojson',     cols: [{h:'Plant Name',p:'Plant'},{h:'City',p:'City'},{h:'Type',p:'Type'},{h:'Capacity (million gallons of ethanol per year)',p:'CapMGe',num:true},{h:'Source',p:'Source'},{h:'Last Updated',p:'SourceDate'}] },
            wastewater:  { file: 'geojson/wastewater.geojson',  cols: [{h:'Facility Name',p:'Name'},{h:'City',p:'City'},{h:'Treatment Type',p:'TreatType'},{h:'On-Site Digester',p:'OnSiteAD'},{h:'Source',p:'Source'},{h:'Last Updated',p:'SourceDate'}] },
            powerplants: { file: 'geojson/powerplants.geojson', cols: [{h:'Plant Name',p:'Plant'},{h:'Utility / Owner',p:'Utility'},{h:'City',p:'City'},{h:'County',p:'County'},{h:'Status',p:'Status',minW:180},{h:'Plant Type',p:'PlantType'},{h:'Technology',p:'Technology',minW:220},{h:'Primary Fuel',p:'PrimaryFuel'},{h:'Other Fuels',p:'OtherFuels'},{h:'MWh/year',p:'MWhYear',num:true},{h:'Source',p:'Source'},{h:'Last Updated',p:'SourceDate'}] },
            standbyplants: { file: 'geojson/standbyplants.geojson', cols: [{h:'Plant Name',p:'Plant'},{h:'Utility / Owner',p:'Utility'},{h:'City',p:'City'},{h:'County',p:'County'},{h:'Status',p:'Status',minW:180},{h:'Plant Type',p:'PlantType'},{h:'Technology',p:'Technology',minW:220},{h:'Primary Fuel',p:'PrimaryFuel'},{h:'Other Fuels',p:'OtherFuels'},{h:'MWh/year',p:'MWhYear',num:true},{h:'Source',p:'Source'},{h:'Last Updated',p:'SourceDate'}] },
            windplants:  { file: 'geojson/windplants.geojson',  cols: [{h:'Plant Name',p:'Plant'},{h:'Utility / Owner',p:'Utility'},{h:'City',p:'City'},{h:'County',p:'County'},{h:'MWh/year',p:'MWhYear',num:true},{h:'Turbines',p:'Turbines',num:true},{h:'Turbine Manufacturer',p:'Manufacturer'},{h:'Year Operating',p:'OperatingYear'},{h:'Source',p:'Source'},{h:'Last Updated',p:'SourceDate'}] },
            solarplants: { file: 'geojson/solarplants.geojson', cols: [{h:'Plant Name',p:'Plant'},{h:'Utility / Owner',p:'Utility'},{h:'City',p:'City'},{h:'County',p:'County'},{h:'MWh/year',p:'MWhYear',num:true},{h:'Mounting',p:'Mounting'},{h:'Year Operating',p:'OperatingYear'},{h:'Source',p:'Source'},{h:'Last Updated',p:'SourceDate'}] },
            landfill:    { file: 'geojson/landfill.geojson',    cols: [{h:'Site Name',p:'Name'},{h:'County',p:'County'},{h:'Type',p:'Type'},{h:'Waste Received (tons/year)',p:'TonsYr',num:true},{h:'LMOP Site',p:'LMOP'},{h:'Source',p:'Source'},{h:'Last Updated',p:'SourceDate'}] },
            digesters:   { file: 'geojson/digesters.geojson',   cols: [{h:'Facility Name',p:'facName'},{h:'City',p:'CityName'},{h:'County',p:'countyName'},{h:'Facility Type',p:'FacilityType'},{h:'Feedstock',p:'Feedstock',minW:260},{h:'Source',p:'Source'},{h:'Last Updated',p:'SourceDate'}] },
            foodwaste:   { file: 'geojson/foodwaste.geojson',   cols: [{h:'Name',p:'Name'},{h:'Category',p:'Category'},{h:'Type',p:'Type'},{h:'City',p:'City'},{h:'County',p:'County'},{h:'Estimated Food Waste (tons/yr)',p:'ExcessAvg',num:true},{h:'Source',p:'Source'},{h:'Last Updated',p:'SourceDate'}] }
        };

        var cache = {};
        var currentKey = 'beef';
        var currentFeatures = [];
        var sortColIdx = -1;
        var sortDir = 1;
        var PAGE_SIZE = 200;      // rows added per "Show More"
        var currentRows = [];     // filtered + sorted rows for the current view
        var shownCount = 0;       // how many of currentRows are in the table

        function selectCategory(key) {
            document.getElementById('category-select').value = key;
            onCategoryChange();
        }

        function onCategoryChange() {
            currentKey = document.getElementById('category-select').value;
            sortColIdx = -1;
            sortDir = 1;
            document.getElementById('search-input').value = '';
            loadAndRender(currentKey);
        }

        function onSearch() {
            renderTable();
        }

        function sortBy(idx) {
            if (sortColIdx === idx) {
                sortDir *= -1;
            } else {
                sortColIdx = idx;
                sortDir = 1;
            }
            renderTable();
        }

        function loadAndRender(key) {
            if (cache[key]) {
                currentFeatures = cache[key];
                renderTable();
                return;
            }
            document.getElementById('farms-loading').style.display = 'block';
            document.getElementById('farms-loading').textContent = 'Loading data...';
            document.getElementById('farms-table').style.display = 'none';
            fetch(categories[key].file)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    cache[key] = data.features;
                    currentFeatures = data.features;
                    renderTable();
                })
                .catch(function() {
                    document.getElementById('farms-loading').textContent = 'Error loading data. Make sure the page is served via HTTP (http://localhost:5500), not opened as a file.';
                });
        }

        function renderTable() {
            var cat = categories[currentKey];
            var search = document.getElementById('search-input').value.toLowerCase();

            var rows = currentFeatures.filter(function(f) {
                if (!search) return true;
                return cat.cols.some(function(c) {
                    return String(f.properties[c.p] || '').toLowerCase().indexOf(search) !== -1;
                });
            });

            if (sortColIdx >= 0) {
                var col = cat.cols[sortColIdx];
                rows = rows.slice().sort(function(a, b) {
                    var av = a.properties[col.p];
                    var bv = b.properties[col.p];
                    if (col.num) {
                        av = parseFloat(av) || 0;
                        bv = parseFloat(bv) || 0;
                    } else {
                        av = String(av || '').toLowerCase();
                        bv = String(bv || '').toLowerCase();
                    }
                    return (av > bv ? 1 : av < bv ? -1 : 0) * sortDir;
                });
            }

            document.getElementById('record-count').textContent = rows.length.toLocaleString() + ' records';

            // Build header
            var thead = '<tr>' + cat.cols.map(function(c, i) {
                var cls = '';
                if (i === sortColIdx) cls = sortDir === 1 ? ' class="sorted-asc"' : ' class="sorted-desc"';
                return '<th' + cls + ' onclick="sortBy(' + i + ')">' + c.h + '</th>';
            }).join('') + '</tr>';

            // Rows: first 200, then 200 more per "Show More"
            currentRows = rows;
            shownCount = Math.min(PAGE_SIZE, rows.length);

            document.getElementById('farms-thead').innerHTML = thead;
            document.getElementById('farms-tbody').innerHTML = rowsHtml(rows.slice(0, shownCount));
            document.getElementById('farms-loading').style.display = 'none';
            document.getElementById('farms-table').style.display = 'table';
            updateShowMore();
        }

        function rowsHtml(list) {
            var cat = categories[currentKey];
            return list.map(function(f) {
                return '<tr>' + cat.cols.map(function(c) {
                    var val = f.properties[c.p];
                    if (val === null || val === undefined) val = '';
                    if (c.num && val !== '') val = Number(val).toLocaleString();
                    return '<td' + (c.minW ? ' style="min-width:' + c.minW + 'px"' : '') + '>' + val + '</td>';
                }).join('') + '</tr>';
            }).join('');
        }

        // Add the next 200 rows (or the rest, if fewer remain)
        function showMore() {
            var next = currentRows.slice(shownCount, shownCount + PAGE_SIZE);
            document.getElementById('farms-tbody').insertAdjacentHTML('beforeend', rowsHtml(next));
            shownCount += next.length;
            updateShowMore();
        }

        function updateShowMore() {
            var box = document.getElementById('farms-more');
            if (!currentRows.length) { box.style.display = 'none'; return; }
            box.style.display = 'block';
            box.innerHTML = shownCount < currentRows.length
                ? '<button type="button" class="farms-more-btn" onclick="showMore()">Show More</button>'
                : '<span class="farms-all-shown">Showing All Facilities</span>';
        }


        // Load default category on page load
        selectCategory(currentKey);
    </script>
</body>
</html>
