    <meta charset="UTF-8">

    <link rel="stylesheet" href="styles.css" />
    <script src="translations.js"></script>
    <style>
        .farms-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            height: 100%;
            padding: 0 20px 20px 0;
            box-sizing: border-box;
        }

        .farms-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .farms-toolbar select {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            background: white;
            color: #2c3e50;
            min-width: 200px;
        }

        .farms-toolbar input[type="text"] {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            min-width: 220px;
        }

        .farms-count {
            font-size: 13px;
            color: #666;
            margin-left: auto;
        }

        .farms-table-wrapper {
            overflow: auto;
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .farms-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .farms-table th {
            background: #4169e1;
            color: white;
            padding: 9px 12px;
            text-align: left;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            position: sticky;
            top: 0;
        }

        .farms-table th:hover {
            background: #2a52cc;
        }

        .farms-table th.sorted-asc::after  { content: ' ▲'; font-size: 10px; }
        .farms-table th.sorted-desc::after { content: ' ▼'; font-size: 10px; }

        .farms-table td {
            padding: 7px 12px;
            border-bottom: 1px solid #eee;
            color: #2c3e50;
        }

        .farms-table tr:hover td {
            background: #f0f4ff;
        }

        .farms-loading {
            padding: 30px;
            text-align: center;
            color: #888;
            font-size: 14px;
        }

        .farms-error {
            padding: 20px;
            color: #c0392b;
            font-size: 14px;
            background: #fdf0ef;
            border-radius: 5px;
            border: 1px solid #e9b8b5;
        }


        html.dark-mode .farms-toolbar select,
        html.dark-mode .farms-toolbar input[type="text"] {
            background: #1a1a2e;
            border-color: #555;
            color: #e0e0e0;
        }

        html.dark-mode .farms-table-wrapper {
            border-color: #444;
        }

        html.dark-mode .farms-table td {
            color: #e0e0e0;
            border-bottom-color: #3a3a50;
        }

        html.dark-mode .farms-table tr:hover td {
            background: #2a2a40;
        }

        html.dark-mode .farms-count {
            color: #aaa;
        }

    </style>
</head>
<body>
    <h1 class="page-heading">
        <div class="logo">
            <img src="logo.png" alt="KS logo" height="44" />
        </div>
        <span data-i18n="site-title">Anaerobic Digestion Pathways</span>
        <a href="settings.html" class="header-gear-btn" title="Settings" onclick="localStorage.setItem('prevPage', location.href)"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.92c.04-.3.07-.61.07-.93s-.03-.64-.07-.93l2-1.57c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2 1.57c-.04.3-.07.61-.07.93s.03.64.07.93l-2 1.57c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.21.07-.47-.12-.61l-2-1.57z"/></svg></a>
    </h1>
    <div class="page-layout">
        <nav class="sidebar">
            <ul>
                <li class="featured-nav-item"><a href="advanced-calculator-2.html" data-i18n="nav-create-microgrid">Create A Microgrid</a><button class="sidebar-toggle" id="sidebar-toggle-btn" onclick="toggleSidebar()" title="Hide sidebar">&#8592;</button></li>
                <li><a href="index.html" data-i18n="nav-home">Discover</a></li>
                <li>
                    <a href="about.html" onclick="document.getElementById('about-submenu').classList.toggle('open');" data-i18n="nav-about">About</a>
                    <ul id="about-submenu" class="submenu">
                        <li><a href="about.html#digestion" data-i18n="nav-what">What is anaerobic digestion?</a></li>
                        <li><a href="about.html#funding" data-i18n="nav-funding">Funding Information</a></li>
                        <li><a href="about.html#our-data" data-i18n="nav-our-data">Our Data</a></li>

                <li><a href="farms.html" class="active" data-i18n="nav-farms">Farms and Facilities</a></li>
                <li><a href="help.html" data-i18n="nav-help">Help</a></li>
            </ul>
        </nav>
        <div class="main-content" style="flex-direction: column; align-items: flex-start; justify-content: flex-start; min-width: 0;">
            <h2 class="section-heading" data-i18n="farms-title">Farms &amp; Facilities</h2>
            <div class="farms-container">
                <div class="farms-toolbar">
                    <select id="category-select" onchange="onCategoryChange()">
                        <option value="beef">Beef Cattle (1,843)</option>
                        <option value="dairy">Dairy Cattle (297)</option>
                        <option value="swine">Swine (439)</option>
                        <option value="turkeys">Turkeys (115)</option>
                        <option value="chickens">Chickens (142)</option>
                        <option value="biodiesel">Biodiesel Plants (8)</option>
                        <option value="ethanol">Ethanol Plants (42)</option>
                        <option value="wastewater">Wastewater Treatment (1,065)</option>
                        <option value="utilities">Utilities (186)</option>
                        <option value="powerplants">Power Plants (217)</option>
                        <option value="landfill">Landfill Sites (84)</option>
                        <option value="digesters">Anaerobic Digesters (87)</option>
                        <option value="foodwaste">Food Waste (275)</option>
                    </select>
                    <input type="text" id="search-input" placeholder="Search..." data-i18n-placeholder="farms-search" oninput="onSearch()" />
                    <span class="farms-count" id="record-count"></span>
                </div>
                <div class="farms-table-wrapper">
                    <div class="farms-loading" id="farms-loading" data-i18n="farms-loading">Loading data...</div>
                    <table class="farms-table" id="farms-table" style="display:none;">
                        <thead id="farms-thead"></thead>
                        <tbody id="farms-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        var categories = {
            beef:        { file: 'geojson/beef.geojson',        cols: [{h:'Facility Name',p:'facName'},{h:'City',p:'CityName'},{h:'County',p:'countyName'},{h:'Head Count',p:'CattleBeef',num:true},{h:'On-Site Digester',p:'OnSiteAD'},{h:'Source',p:'Source'},{h:'Source Date',p:'SourceDate'}] },
            dairy:       { file: 'geojson/dairy.geojson',       cols: [{h:'Facility Name',p:'facName'},{h:'City',p:'CityName'},{h:'County',p:'countyName'},{h:'Head Count',p:'CattleDair',num:true},{h:'On-Site Digester',p:'OnSiteAD'},{h:'Source',p:'Source'},{h:'Source Date',p:'SourceDate'}] },
            swine:       { file: 'geojson/swine.geojson',       cols: [{h:'Facility Name',p:'facName'},{h:'City',p:'CityName'},{h:'County',p:'countyName'},{h:'Head Count',p:'Swine',num:true},{h:'On-Site Digester',p:'OnSiteAD'},{h:'Source',p:'Source'},{h:'Source Date',p:'SourceDate'}] },
            turkeys:     { file: 'geojson/turkeys.geojson',     cols: [{h:'Facility Name',p:'facName'},{h:'City',p:'CityName'},{h:'County',p:'countyName'},{h:'Count',p:'Turkeys',num:true},{h:'On-Site Digester',p:'OnSiteAD'},{h:'Source',p:'Source'},{h:'Source Date',p:'SourceDate'}] },
            chickens:    { file: 'geojson/chickens.geojson',    cols: [{h:'Facility Name',p:'facName'},{h:'City',p:'CityName'},{h:'County',p:'countyName'},{h:'Count',p:'Chickens',num:true},{h:'On-Site Digester',p:'OnSiteAD'},{h:'Source',p:'Source'},{h:'Source Date',p:'SourceDate'}] },
            biodiesel:   { file: 'geojson/biodiesel.geojson',   cols: [{h:'Plant Name',p:'Plant'},{h:'City',p:'City'},{h:'Feedstock',p:'Feedstock'},{h:'Capacity (million gallons of biodiesel per year)',p:'CapMGb',num:true},{h:'Source',p:'Source'},{h:'Source Date',p:'SourceDate'}] },
            ethanol:     { file: 'geojson/ethanol.geojson',     cols: [{h:'Plant Name',p:'Plant'},{h:'City',p:'City'},{h:'Type',p:'Type'},{h:'Capacity (million gallons of ethanol per year)',p:'CapMGe',num:true},{h:'Source',p:'Source'},{h:'Source Date',p:'SourceDate'}] },
            wastewater:  { file: 'geojson/wastewater.geojson',  cols: [{h:'Facility Name',p:'Name'},{h:'City',p:'City'},{h:'Treatment Type',p:'TreatType'},{h:'On-Site Digester',p:'OnSiteAD'},{h:'Source',p:'Source'},{h:'Source Date',p:'SourceDate'}] },
            utilities:   { file: 'geojson/utilities.geojson',   cols: [{h:'Company',p:'COMPANY_NA'},{h:'City',p:'CITY'},{h:'Type',p:'type'},{h:'Total Consumption',p:'TOTAL_CONS',num:true},{h:'Source',p:'Source'},{h:'Source Date',p:'SourceDate'}] },
            powerplants: { file: 'geojson/powerplants.geojson', cols: [{h:'Plant Name',p:'PLANT_NAME'},{h:'Utility',p:'UTILITY_NA'},{h:'Primary Fuel',p:'primary_fu'},{h:'Capacity (MW)',p:'total_cap',num:true},{h:'Source',p:'Source'},{h:'Source Date',p:'SourceDate'}] },
            landfill:    { file: 'geojson/landfill.geojson',    cols: [{h:'Site Name',p:'Name'},{h:'County',p:'County'},{h:'Type',p:'Type'},{h:'Tons per Year',p:'TonsYr',num:true},{h:'LMOP',p:'LMOP'},{h:'Source',p:'Source'},{h:'Source Date',p:'SourceDate'}] },
            digesters:   { file: 'geojson/digesters.geojson',   cols: [{h:'Facility Name',p:'facName'},{h:'City',p:'CityName'},{h:'County',p:'countyName'},{h:'Facility Type',p:'FacilityType'},{h:'Feedstock',p:'Feedstock',minW:260},{h:'Source',p:'Source'},{h:'Source Date',p:'SourceDate'}] },
            foodwaste:   { file: 'geojson/foodwaste.geojson',   cols: [{h:'Name',p:'Name'},{h:'Category',p:'Category'},{h:'Type',p:'Type'},{h:'City',p:'City'},{h:'County',p:'County'},{h:'Estimated Food Waste (tons/yr)',p:'ExcessAvg',num:true},{h:'Source',p:'Source'},{h:'Source Date',p:'SourceDate'}] }
        };

        var cache = {};
        var currentKey = 'beef';
        var currentFeatures = [];
        var sortColIdx = -1;
        var sortDir = 1;

        function selectCategory(key) {
            document.getElementById('category-select').value = key;
            onCategoryChange();
        }

        function onCategoryChange() {
            currentKey = document.getElementById('category-select').value;
            sortColIdx = -1;
            sortDir = 1;
            document.getElementById('search-input').value = '';
            loadAndRender(currentKey);
        }

        function onSearch() {
            renderTable();
        }

        function sortBy(idx) {
            if (sortColIdx === idx) {
                sortDir *= -1;
            } else {
                sortColIdx = idx;
                sortDir = 1;
            }
            renderTable();
        }

        function loadAndRender(key) {
            if (cache[key]) {
                currentFeatures = cache[key];
                renderTable();
                return;
            }
            document.getElementById('farms-loading').style.display = 'block';
            document.getElementById('farms-loading').textContent = 'Loading data...';
            document.getElementById('farms-table').style.display = 'none';
            fetch(categories[key].file)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    cache[key] = data.features;
                    currentFeatures = data.features;
                    renderTable();
                })
                .catch(function() {
                    document.getElementById('farms-loading').textContent = 'Error loading data. Make sure the page is served via HTTP (http://localhost:5500), not opened as a file.';
                });
        }

        function renderTable() {
            var cat = categories[currentKey];
            var search = document.getElementById('search-input').value.toLowerCase();

            var rows = currentFeatures.filter(function(f) {
                if (!search) return true;
                return cat.cols.some(function(c) {
                    return String(f.properties[c.p] || '').toLowerCase().indexOf(search) !== -1;
                });
            });

            if (sortColIdx >= 0) {
                var col = cat.cols[sortColIdx];
                rows = rows.slice().sort(function(a, b) {
                    var av = a.properties[col.p];
                    var bv = b.properties[col.p];
                    if (col.num) {
                        av = parseFloat(av) || 0;
                        bv = parseFloat(bv) || 0;
                    } else {
                        av = String(av || '').toLowerCase();
                        bv = String(bv || '').toLowerCase();
                    }
                    return (av > bv ? 1 : av < bv ? -1 : 0) * sortDir;
                });
            }

            document.getElementById('record-count').textContent = rows.length.toLocaleString() + ' records';

            // Build header
            var thead = '<tr>' + cat.cols.map(function(c, i) {
                var cls = '';
                if (i === sortColIdx) cls = sortDir === 1 ? ' class="sorted-asc"' : ' class="sorted-desc"';
                return '<th' + cls + ' onclick="sortBy(' + i + ')">' + c.h + '</th>';
            }).join('') + '</tr>';

            // Build rows (cap at 2000 visible rows for performance)
            var visible = rows.slice(0, 2000);
            var tbody = visible.map(function(f) {
                return '<tr>' + cat.cols.map(function(c) {
                    var val = f.properties[c.p];
                    if (val === null || val === undefined) val = '';
                    if (c.num && val !== '') val = Number(val).toLocaleString();
                    return '<td' + (c.minW ? ' style="min-width:' + c.minW + 'px"' : '') + '>' + val + '</td>';
                }).join('') + '</tr>';
            }).join('');

            if (rows.length > 2000) {
                tbody += '<tr><td colspan="' + cat.cols.length + '" style="text-align:center;color:#888;font-style:italic;">Showing first 2,000 of ' + rows.length.toLocaleString() + ' records. Use search to filter.</td></tr>';
            }

            document.getElementById('farms-thead').innerHTML = thead;
            document.getElementById('farms-tbody').innerHTML = tbody;
            document.getElementById('farms-loading').style.display = 'none';
            document.getElementById('farms-table').style.display = 'table';
        }

        // Sidebar
        if (localStorage.getItem('sidebar') === 'hidden') {
            document.querySelector('.page-layout').classList.add('sidebar-hidden');
            var t = document.getElementById('sidebar-toggle-btn');
            if (t) t.innerHTML = '&#8594;';
        }
        function toggleSidebar() {
            var layout = document.querySelector('.page-layout');
            layout.classList.toggle('sidebar-hidden');
            var hidden = layout.classList.contains('sidebar-hidden');
            localStorage.setItem('sidebar', hidden ? 'hidden' : 'visible');
            var t = document.getElementById('sidebar-toggle-btn');
            if (t) t.innerHTML = hidden ? '&#8594;' : '&#8592;';
        }

        // Load default category on page load
        selectCategory(currentKey);
    </script>
</body>
</html>
